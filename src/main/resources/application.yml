spring:
  application:
    name: conciliacion-batch
  datasource:
    # H2 en fichero: los datos (tabla facturas) y las tablas BATCH_* de metadatos
    # persisten tras la ejecución, de modo que se pueden inspeccionar después.
    # La ruta ./data está en .gitignore.
    url: jdbc:h2:file:./data/conciliacion;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # Creación del esquema de la aplicación
      schema-locations: classpath:schema-all.sql
      mode: always
  batch:
    jdbc:
      # Inicialización de tablas de Spring Batch en H2 (requiere spring-boot-starter-batch-jdbc)
      initialize-schema: always
